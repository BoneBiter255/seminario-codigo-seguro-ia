[project]
name = "revia"
version = "0.1.0"
description = "Pipeline de revision de codigo seguro asistida por IA con verificacion independiente"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

# Proveedores de LLM opcionales. Ollama no necesita paquete (habla HTTP local).
[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
groq = ["groq>=0.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
revia = "revia.pipeline:main"
